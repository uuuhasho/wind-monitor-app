            opt.textContent = `${ship.d} ${ship.ship_name}`;
            select.appendChild(opt);
        });
    }

    function onForecastShipChange() {
        // 切換船期時重新更新圖表的 ECharts option，讓 tooltip 能即時反映新選中船的限速
        if (forecastChartInstance && lastFetchedForecastData) {
            renderForecastChart(lastFetchedForecastData);
        }
    }

    // 初始化 ECharts 圖表
    function initForecastChart() {
        const chartDom = document.getElementById('forecastChart');
        if (!forecastChartInstance) {
            forecastChartInstance = echarts.init(chartDom, 'dark', { renderer: 'canvas' });
        }
    }

    // 從 Firebase RTDB 載入數據
    async function loadForecastData() {
        const statusEl = document.getElementById('forecastStatus');
        statusEl.innerText = "正在載入數據...";
        statusEl.style.color = "#58a6ff";

        try {
            const snapshot = await db.ref('formal/forecast_data').once('value');
            if (!snapshot.exists()) {
                statusEl.innerText = "資料庫無預報數據";
                statusEl.style.color = "#ff7b72";
                return;
            }

            const rawData = snapshot.val();
            let data = Array.isArray(rawData) ? rawData.filter(i => i) : Object.values(rawData);
            
            // 確保資料依時間升序排列
            data.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            lastFetchedForecastData = data;
            renderForecastChart(data);
            
            // 從另外的節點讀取最後更新時間
            const metaSnapshot = await db.ref('formal/forecast_metadata').once('value');
            let latestUpdatedAt = null;
            if (metaSnapshot.exists() && metaSnapshot.val().updatedAt) {
                latestUpdatedAt = new Date(metaSnapshot.val().updatedAt);
            }

            if (data.length > 0) {
                if (latestUpdatedAt) {
                    const twTime = new Date(latestUpdatedAt.getTime() + 8 * 60 * 60 * 1000);
                    const m = twTime.getUTCMonth() + 1;
                    const d = twTime.getUTCDate();
                    const hh = String(twTime.getUTCHours()).padStart(2, '0');
                    const mm = String(twTime.getUTCMinutes()).padStart(2, '0');
                    statusEl.innerText = `${m}/${d} ${hh}:${mm} 數據已更新`;
                } else {
                    statusEl.innerText = "數據已載入 (無更新時間)";
                }
                statusEl.style.color = "#58a6ff";
            }
        } catch (err) {
            console.error("Firebase RTDB 載入預估數據失敗:", err);
            statusEl.innerText = "載入失敗，請檢查網路連線";
            statusEl.style.color = "#ff7b72";
        }
    }

    // 渲染 ECharts 雙曲線圖表
    function renderForecastChart(data) {
        if (!forecastChartInstance) return;

        // 確保圖表正確調整大小以防範 Modal 初始化尺寸問題
        forecastChartInstance.resize();

        // 格式化 X 軸時間顯示為 M/D HH:00 (強制轉換為台灣時間)
        const timeData = data.map(item => {
            const date = new Date(item.timestamp);
            // 加上 8 小時毫秒數，然後使用 UTC 方法取得台灣時間，避免瀏覽器時區差異
            const twDate = new Date(date.getTime() + 8 * 60 * 60 * 1000);
            const mm = String(twDate.getUTCMonth() + 1);
            const dd = String(twDate.getUTCDate());
            const hh = String(twDate.getUTCHours()).padStart(2, '0');
            return `${mm}/${dd} ${hh}:00`;
        });

        const cpcData = data.map(item => item.cpc_wind_speed);
        const omData = data.map(item => item.open_meteo_wind_speed);

        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                confine: true,
                axisPointer: { type: 'line', lineStyle: { color: '#30363d', type: 'dashed' } },
                backgroundColor: 'rgba(22, 27, 34, 0.75)', // 半透明背景
                extraCssText: 'backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 8px;', // 毛玻璃效果
                className: 'custom-tooltip',
                borderWidth: 0,
                shadowBlur: 0,
                formatter: function (params) {
                    const selectEl = document.getElementById('shipForecastSelect');
                    if (!selectEl || selectEl.options.length === 0) return '';
                    
                    const selectedText = selectEl.options[selectEl.selectedIndex].text;
                    // 格式如 "6/9 LNG Endeavour"，提取船名
                    const shipName = selectedText.includes(' ') ? selectedText.split(' ').slice(1).join(' ') : selectedText;
                    const limitSpeed = parseFloat(selectEl.value); // 取得限制速限

                    const time = params[0].name;
                    let cpcVal = null;
                    let ecmwfVal = null;

                    params.forEach(param => {
                        if (param.seriesName === '空軍預測' && param.value != null) cpcVal = param.value;
                        if (param.seriesName === 'ECMWF陣風' && param.value != null) ecmwfVal = param.value;
                    });

                    // 💡 安全判定：若空軍預測 < 該船限速，顯示綠字"可進港"，否則紅字"無法進港"
                    let statusHtml = '';
                    if (cpcVal !== null) {
                        const isSafe = cpcVal < limitSpeed;
                        statusHtml = isSafe 
                            ? `<span style="color:#2ecc71; font-weight:bold;">(可進港)</span>`
                            : `<span style="color:#e74c3c; font-weight:bold;">(無法進港)</span>`;
                    } else {
                        statusHtml = `<span style="color:#8b949e; font-weight:bold;">(無預測資料)</span>`;
                    }

                    return `
                        <div class="tooltip-time">${time}</div>
                        <div style="font-weight:bold; margin-bottom:8px;">${shipName} ${statusHtml}</div>
                        <div class="tooltip-row">
                            <span>空軍預測:</span>
                            <span class="tooltip-val" style="color:#ffffff;">${cpcVal !== null ? cpcVal.toFixed(2) + ' m/s' : '無資料'}</span>
                        </div>
                        <div class="tooltip-row">
                            <span>ECMWF陣風:</span>
                            <span class="tooltip-val" style="color:#ffffff;">${ecmwfVal !== null ? ecmwfVal.toFixed(2) + ' m/s' : '無資料'}</span>
                        </div>
                    `;
                }
            },
            legend: {
                show: false
            },
            grid: {
                left: '4%',
                right: '4%',
                bottom: '18%',
                top: '12%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: timeData,
                axisLine: { lineStyle: { color: '#30363d' } },
                axisLabel: { color: '#8b949e', fontSize: 10 },
                splitLine: { show: true, lineStyle: { color: '#161b22', type: 'dashed' } }
            },
            yAxis: {
                type: 'value',
                name: '',
                nameTextStyle: { color: '#8b949e', fontSize: 10 },
                axisLabel: { color: '#8b949e', fontSize: 10 },
                splitLine: { show: true, lineStyle: { color: '#21262d' } }
            },
            dataZoom: [
                {
                    type: 'slider', // 在圖表下方顯示一個實體滑動條，方便精準拖移
                    showDetail: false,
                    showDataShadow: false,
                    zoomLock: true, // 固定寬度，不允許縮放
                    dataBackground: { lineStyle: { opacity: 0 }, areaStyle: { opacity: 0 } },
                    selectedDataBackground: { lineStyle: { opacity: 0 }, areaStyle: { opacity: 0 } },
                    orient: 'horizontal',
                    bottom: '0%',
                    height: 16,
                    start: 0,
                    end: 35,
                    textStyle: { color: '#8b949e', fontSize: 9 },
                    borderColor: 'transparent', // 隱藏外框
                    backgroundColor: 'transparent', // 隱藏底色
                    fillerColor: 'rgba(56, 139, 253, 0.15)',
                    handleSize: 0,
                    handleIcon: 'none',
                    handleStyle: {
                        color: 'transparent'
                    }
                }
            ],
            series: [
                {
                    name: '空軍預測',
                    type: 'line',
                    data: cpcData,
                    smooth: true,
                    connectNulls: true,
                    showSymbol: false,
                    lineStyle: {
                        width: 2,
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: '#f97316' },
                            { offset: 1, color: '#ff7b72' }
                        ])
                    },
                    itemStyle: { color: '#ff7b72' },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(255, 123, 114, 0.15)' },
                            { offset: 1, color: 'rgba(255, 123, 114, 0)' }
                        ])
                    }
                },
                {
                    name: 'ECMWF陣風',
                    type: 'line',
                    data: omData,
                    smooth: true,
                    connectNulls: true,
                    showSymbol: false,
                    lineStyle: {
                        width: 1.5,
                        type: 'dashed',
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: '#06b6d4' },
                            { offset: 1, color: '#58a6ff' }
                        ])
                    },
                    itemStyle: { color: '#58a6ff' },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(88, 166, 255, 0.1)' },
                            { offset: 1, color: 'rgba(88, 166, 255, 0)' }
                        ])
                    }
                }
            ]
        };

        forecastChartInstance.dispatchAction({ type: 'hideTip' });
        forecastChartInstance.setOption(option);

        // 🚢 UX 新增：選中船期時，自動定位到該船當天預報數據點並顯示 Tooltip (夏季 05:00 / 冬季 06:00)
        try {
            const selectEl = document.getElementById('shipForecastSelect');
            if (selectEl && selectEl.options.length > 0) {
                const selectedText = selectEl.options[selectEl.selectedIndex].text;
                // 提取日期，selectedText 格式如 "6/9 LNG Endeavour"
                const datePart = selectedText.split(' ')[0]; // 取得 "6/9"
                if (datePart && datePart.includes('/')) {
                    const parts = datePart.split('/');
                    const mm = parts[0];
                    const dd = parts[1];
                    
                    // 判斷夏季或冬季：
                    // 夏季月份：4, 5, 6, 7, 8, 9
                    // 冬季月份：10, 11, 12, 1, 2, 3
                    const month = parseInt(parts[0], 10);
                    const isSummer = [4, 5, 6, 7, 8, 9].includes(month);
                    const targetTime = isSummer ? "05:00" : "06:00";
                    const targetLabel = `${mm}/${dd} ${targetTime}`;
                    
                    const targetIndex = timeData.indexOf(targetLabel);
                    if (targetIndex !== -1) {
                        // 計算 dataZoom 的 start 和 end，讓 targetIndex 居中
                        // 目前的 dataZoom 區間長度是 35% (end - start = 35)
                        const totalPoints = timeData.length;
                        const percent = (targetIndex / totalPoints) * 100;
                        let startPercent = percent - 17.5;
                        let endPercent = percent + 17.5;
                        
                        if (startPercent < 0) {
                            startPercent = 0;
                            endPercent = 35;
                        } else if (endPercent > 100) {
                            endPercent = 100;
                            startPercent = 65;
                        }
                        
                        // 1. 移動 DataZoom
                        forecastChartInstance.dispatchAction({
                            type: 'dataZoom',
                            start: startPercent,
                            end: endPercent
                        });
                        
                        // 2. 觸發 Tooltip 顯示
                        // 使用 setTimeout 確保 dataZoom 行動完成後再觸發 showTip，這樣定位更精確
                        setTimeout(() => {
                            if (forecastChartInstance) {
                                forecastChartInstance.dispatchAction({
                                    type: 'showTip',
                                    seriesIndex: 0,
                                    dataIndex: targetIndex
                                });
                            }
                        }, 80);
                    }
                }
            }
        } catch (e) {
            console.error("自動定位選中船期時間失敗:", e);
        }
    }

    // 觸發手動更新 ECharts 氣象資料 (呼叫 GAS 並以密碼保護)
    async function triggerForecastUpdate() {
        // 呼叫原本的密碼驗證彈窗
        const password = await getPasswordFromModal();
        if (password === null) return;
        
        if (password.trim() === "") {
            alert("❌ 密碼不能為空！");
            return;
        }

        const updateBtn = document.getElementById('forecastUpdateBtn');
        const statusEl = document.getElementById('forecastStatus');
        
        // 前端立刻進入鎖定狀態，防止二次點選
        updateBtn.disabled = true;
        updateBtn.innerHTML = `<span>⏳ 雲端更新中(約需1分鐘)...</span>`;
        statusEl.innerText = "數據更新中...";
        statusEl.style.color = "#d29922";

        try {
            // 呼叫 Cloud Run API 並帶入 force=true
            const url = `${CLOUD_RUN_API_URL}?force=true&pwd=${encodeURIComponent(password)}`;
            const response = await fetch(url, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            
            if (!response.ok) {
                throw new Error("伺服器回傳狀態異常: " + response.status);
            }
            
            statusEl.innerText = "指令已下達，雲端正在運行 Pipeline...";
            statusEl.style.color = "#e3b341";
        } catch (error) {
            console.error("手動更新呼叫失敗:", error);
            alert("❌ 連線錯誤，請檢查網路狀態");
            updateBtn.disabled = false;
            updateBtn.innerHTML = `<span>🔄 手動更新</span>`;
            statusEl.innerText = "連線失敗";
            statusEl.style.color = "#ff7b72";
        }
    }
    
    // --- 船期手動調整視窗邏輯 ---
    let editScheduleList = [];
    let originalScheduleSnapshot = [];
    
    function openScheduleAdjustModal() {
        editScheduleList = JSON.parse(JSON.stringify(scheduleDataList));
        originalScheduleSnapshot = JSON.parse(JSON.stringify(scheduleDataList));
        document.getElementById('scheduleAdjustModal').style.display = 'flex';
        renderAdjustTable();
    }
    
    function closeScheduleAdjustModal() {
        document.getElementById('scheduleAdjustModal').style.display = 'none';
        releaseLock();
        cachedSessionPassword = ""; // 🌟 關閉船期調整時清空快取密碼
    }
    
    function validateDateInput(input, index) {
        let val = input.value.trim();
        
        // 💡 自動格式化：如果只輸入數字且長度為 3 或 4 (例如 623 -> 6/23, 1025 -> 10/25)
        if (/^\d{3,4}$/.test(val)) {
            let m, d;
            if (val.length === 3) {
                const firstTwo = parseInt(val.substring(0, 2), 10);
                if (firstTwo >= 10 && firstTwo <= 12) {
                    m = val.substring(0, 2);
                    d = val.substring(2);
                } else {
                    m = val.substring(0, 1);
                    d = val.substring(1);
                }
            } else {
                m = val.substring(0, 2);
                d = val.substring(2);
            }
            
            const monthVal = parseInt(m, 10);
            const dayVal = parseInt(d, 10);
            if (monthVal >= 1 && monthVal <= 12 && dayVal >= 1 && dayVal <= 31) {
                val = `${monthVal}/${dayVal}`;
                input.value = val;
                if (index !== undefined) {
                    updateEditItem(index, 'd', val);
                }
            }
        }
        
        const errorDiv = input.nextElementSibling;
        if (!errorDiv) return;
        
        if (val === "") {
            errorDiv.style.display = "none";
            input.style.borderColor = "";
            return;
        }
        
        const dateRegex = /^\d{1,2}\/\d{1,2}$/;
        if (!dateRegex.test(val)) {
            errorDiv.style.display = "block";
            input.style.borderColor = "#dc3545";
        } else {
            errorDiv.style.display = "none";
            input.style.borderColor = "";
        }
    }

    function renderAdjustTable() {
        const tbody = document.getElementById('adjustTableBody');
        let html = '';
        if (editScheduleList.length === 0) {
            html = '<tr><td colspan="4" style="text-align:center; color:#888; padding: 15px;">目前編輯清單為空，請點擊新增一列</td></tr>';
        } else {
            editScheduleList.forEach((item, index) => {
                html += `
                <tr>
                    <td style="position: relative;">
                        <input type="text" value="${item.d || ''}" placeholder="如 6/14" style="width: 100%;" 
                               onchange="updateEditItem(${index}, 'd', this.value)"
                               onblur="validateDateInput(this, ${index})">
                        <div class="date-error" style="color: #dc3545; font-size: 10px; text-align: left; margin-top: 2px; display: none;">格式須為M/D</div>
                    </td>
                    <td>
                        <select style="width: 100%;" onchange="updateEditItem(${index}, 'terminal', this.value)">
                            <option value="" ${item.terminal === '' ? 'selected' : ''}></option>
                            <option value="W12" ${item.terminal === 'W12' ? 'selected' : ''}>W12</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" value="${item.ship_name || ''}" placeholder="船名" style="width: 100%; text-align: left; padding-left: 4px;" onchange="updateEditItem(${index}, 'ship_name', this.value)">
                    </td>
                    <td>
                        <select style="width: 100%;" onchange="updateEditItem(${index}, 'limit_speed', this.value)">
                            <option value="15" ${Number(item.limit_speed) === 15.0 ? 'selected' : ''}>15</option>
                            <option value="12" ${Number(item.limit_speed) === 12.0 ? 'selected' : ''}>12</option>
                        </select>
                    </td>
                </tr>
                `;
            });
        }
        tbody.innerHTML = html;
    }
    
    function updateEditItem(index, key, val) {
        if (editScheduleList[index]) {
            if (key === 'limit_speed') {
                editScheduleList[index][key] = parseFloat(val) || 15.0;
            } else {
                editScheduleList[index][key] = val;
            }
        }
    }
    
    function addEditItem() {
        editScheduleList.unshift({
            d: '',
            ship_name: '',
            limit_speed: 15.0,
            terminal: '',
            source: 'manual'
        });
        renderAdjustTable();
        
        // 滾動到最上方
        const tbody = document.getElementById('adjustTableBody');
        const tableContainer = tbody.parentElement.parentElement;
        tableContainer.scrollTop = 0;
    }
    
    async function saveScheduleAdjustments() {
        // 1. 驗證資料
        for (let i = 0; i < editScheduleList.length; i++) {
            const item = editScheduleList[i];
            const cleanD = (item.d || "").trim();
            const cleanName = (item.ship_name || "").trim();
            
            if (!cleanName) {
                alert(`❌ 第 ${i+1} 筆資料船名不能為空！`);
                return;
            }
            
            // 日期驗證：允許日期空白 (如 UNFINISHED_SHIP)，若填寫則需符合 M/D 格式
            if (cleanD !== "") {
                const dateRegex = /^\d{1,2}\/\d{1,2}$/;
                if (!dateRegex.test(cleanD)) {
                    alert(`❌ 第 ${i+1} 筆資料日期 [${cleanD}] 格式不正確，應為 M/D (例如: 6/14)`);
                    return;
                }
            }
        }
        
        // 2. 獲取密碼
        const password = cachedSessionPassword;
        if (!password) {
            alert("❌ 密碼驗證 Session 已過期，請重新進入視窗！");
            return;
        }
        
        // 3. 計算差異 (Diff) 項目送給 GAS，避免覆寫未修改的日曆項目
        const diffList = [];
        
        // A. 找出新增或修改的船隻
        editScheduleList.forEach(item => {
            const orig = originalScheduleSnapshot.find(o => o.ship_name === item.ship_name);
            if (!orig) {
                // 新增項目
                diffList.push({
                    d: item.d.trim(),
                    ship_name: item.ship_name.trim(),
                    limit_speed: Number(item.limit_speed),
                    terminal: item.terminal || "",
                    is_deleted: false
                });
            } else if (item.d.trim() !== orig.d.trim() || 
                       Number(item.limit_speed) !== Number(orig.limit_speed) || 
                       (item.terminal || "") !== (orig.terminal || "")) {
                // 修改項目
                diffList.push({
                    d: item.d.trim(),
                    ship_name: item.ship_name.trim(),
                    limit_speed: Number(item.limit_speed),
                    terminal: item.terminal || "",
                    is_deleted: false
                });
            }
        });
        
        // B. 找出被刪除的船隻
        originalScheduleSnapshot.forEach(orig => {
            const current = editScheduleList.find(c => c.ship_name === orig.ship_name);
            if (!current) {
                diffList.push({
                    ship_name: orig.ship_name,
                    d: orig.d,
                    is_deleted: true
                });
            }
        });
        
        if (diffList.length === 0) {
            alert("ℹ️ 未偵測到任何修改！");
            closeScheduleAdjustModal();
            return;
        }
        
        const saveBtn = document.querySelector('#scheduleAdjustModal .btn-confirm');
        let originalText = "";
        if (saveBtn) {
            originalText = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = "⏳ 儲存中...";
        }
        
        document.getElementById('loading').innerText = "儲存調整中...";
        try {
            const url = `${FIXED_GAS_API_URL}action=update_schedule&pwd=${encodeURIComponent(password)}`;
            
            // I13: 改以 POST 發送以突破 URL 長度限制 (使用 URLSearchParams 確保 GAS doPost 可自動解析)
            const params = new URLSearchParams();
            params.append('schedule', JSON.stringify(diffList));
            
            await fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                body: params
            });
            
            alert("✅ 船期調整儲存成功！\n(採用背景發送，請稍候重整網頁確認結果)");
            closeScheduleAdjustModal();
        } catch(e) {
            console.error("Save schedule error:", e);
            alert("❌ 執行儲存失敗：" + e.message);
        } finally {
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
            document.getElementById('loading').innerText = "";
        }
    }

    window.onload = function() {

        initSystem();
    };
</script>
